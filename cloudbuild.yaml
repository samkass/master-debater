
# Default Values
substitutions:
  _SERVICE_NAME: master-debater
  _REGION: europe-west1
  _SHORT_SHA: 'unknown'
  _SERVICE_SUFFIX: '' # by default deploy to a side deployment; override in the Cloud Build config

steps:
  ### Build
  - id: "build image"
    name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}", "."]

  ### Push
  - id: "push image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}"]

  ### Deploy
  - id: "deploy prod service"
    name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}${_SERVICE_SUFFIX}'
      - '--image=gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated' # double check auth works before going live with this setting
      - '--update-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_ORG_ID=OPENAI_ORG_ID:latest'
      - '--tag=${BRANCH_NAME}'
